# Iris default configuration.
# Do NOT edit this file on the Pi: it is replaced on every update.
# Put your changes in config/local.yaml (same structure; values there win).

timezone: Europe/Rome            # your clock: quiet hours and digest use it
quiet_hours: {start: "23:00", end: "07:30"}
digest_time: "07:30"

# Severity levels: critical (any hour), high (immediate, held during quiet hours), info (digest only)

locations:
  - id: milan
    name: Milan
    lat: 45.4642
    lon: 9.1900
    tz: Europe/Rome
    country: IT
    profile: home
    comune: Milano          # → civil protection zone "Nodo Idraulico di Milano"
    region: Lombardia       # for regional/local transport strikes
    province: Milano
  - id: santiago
    name: Santiago
    lat: -33.4489
    lon: -70.6693
    tz: America/Santiago
    country: CL
    profile: watch
  - id: talca
    name: Talca
    lat: -35.4264
    lon: -71.6554
    tz: America/Santiago
    country: CL
    profile: watch

# The place that follows you (Telegram live location, a pin, or /trip). See /here.
here:
  profile: home            # same sensitivity as Milan
  near_km: 25              # within this distance of a fixed place, the fixed place is enough
  follow_timezone: true    # quiet hours and the digest follow your local time while travelling
  near_you_km: 1.5         # live location: incidents this close to you are raised one level ("800 m from you")
  mention_km: 3            # ...and within this distance the alert says how far from you it is
  near_you_critical_min_severity: 3   # the boost reaches CRITICAL only for significant incidents (3+)

# Add more places here in local.yaml without repeating the list above:
extra_locations: []

profiles:
  home:            # full sensitivity
    quake:         # [min magnitude, max distance km]
      critical: [[5.0, 50], [6.0, 200]]
      high:     [[3.5, 50], [5.0, 200], [5.5, 800]]
      info:     [[2.5, 100], [4.0, 400]]
    gdacs_radius_km: 300
    forecast_level: info        # official warnings (Meteoalarm) cover this place; forecasts go to digest
    forecast: {rain_mm: 50, gust_kmh: 80, tmax_c: 37, tmin_c: -8}
    news_radius_km: 30
    news: {critical: 4, high: 3, info: 2}     # news severity (1-5) needed for each level
  watch:           # significant events only
    quake:
      critical: [[6.5, 150], [7.5, 400]]
      high:     [[5.5, 150], [6.5, 400]]
      info:     [[4.5, 150]]
    gdacs_radius_km: 400
    forecast_level: info        # SENAPRED's official alerts cover Chile now; forecasts go to the digest
    forecast: {rain_mm: 60, gust_kmh: 90, tmax_c: 36, tmin_c: -6}
    news_radius_km: 60
    news: {critical: 5, high: 4, info: 3}

# News elsewhere in the same country as one of your locations
news_country: {high: 5, info: 4}
# News anywhere in the world (only items rated world-significant)
news_world: {high: 5, info: 4, min_deaths: 100}   # 100+ reported deaths always counts as world-significant

world:
  quake: {high: 7.0, info: 6.2}
  gdacs: {red: high, orange: info}      # far-away disasters never wake you up

meteoalarm:
  - feed: italy
    areas: [Lombardia]
    location: milan
    # Region-wide (Lombardy includes the Alps): digest only. Rain/flood/thunderstorm come zone-level from DPC.
    max_level: info
    skip_events: [thunderstorm, rain, flood]

sources:           # polling intervals in seconds; set enabled: false to switch one off
  usgs:       {enabled: true, interval: 60}
  emsc:       {enabled: true, interval: 60}
  ingv:       {enabled: true, interval: 60}
  gdacs:      {enabled: true, interval: 300}
  ptwc:       {enabled: true, interval: 120}
  meteoalarm: {enabled: true, interval: 600}
  openmeteo:  {enabled: true, interval: 10800}
  dpc:        {enabled: true, interval: 1800}   # Italian civil protection alert zones (yellow/orange/red)
  strikes:    {enabled: true, interval: 21600}  # Italian transport strike calendar (MIT)
  air:        {enabled: true, interval: 21600}  # air quality forecast (PM2.5)
  news:       {enabled: true, interval: 600}

llm:
  triage_model: claude-haiku-5-5      # reads, translates and rates news (cheap, high volume)
  verify_model: claude-haiku-5-5      # checks HIGH news before alerting you, writes the alert (~$0.01 each)
  critical_verify_model: claude-sonnet-5-5   # only for news that would be CRITICAL (rare)
  context_model: claude-haiku-5-5     # impact follow-ups after big hazard alerts
  daily_budget_usd: 0.40              # hard cap per day (about $12/month max); hazard alerts never depend on it
  web_search: true
  context_followups: true             # after a big hazard alert near you, look for impact reports
  context_delay_minutes: 12
  digest_overview: true

news:
  max_age_hours: 8
  single_source_wait_minutes: 15      # wait for a second outlet before verifying a single-source story
  max_triage_per_cycle: 150
  feeds:
    # Milan / Italy
    - {id: ansa_lombardia, url: "https://www.ansa.it/lombardia/notizie/lombardia_rss.xml", lang: it, scope: milan}
    - {id: ilgiorno, url: "https://www.ilgiorno.it/rss/cronaca", lang: it, scope: milan}
    - {id: milanotoday, url: "https://www.milanotoday.it/rss", lang: it, scope: milan}
    - {id: ansa_ultimaora, url: "https://www.ansa.it/sito/notizie/topnews/topnews_rss.xml", lang: it, scope: IT}
    - {id: ansa_cronaca, url: "https://www.ansa.it/sito/notizie/cronaca/cronaca_rss.xml", lang: it, scope: IT}
    # Chile
    - {id: latercera, url: "https://www.latercera.com/arc/outboundfeeds/rss/?outputType=xml", lang: es, scope: CL}
    - {id: cooperativa, url: "https://www.cooperativa.cl/noticias/site/tax/port/all/rss_3___1.xml", lang: es, scope: CL}
    # BioBioChile has no public RSS any more: it comes through GDELT (see below)
    # SENAPRED (Chile's disaster agency) official channel: evacuations, alerts, earthquakes. Official = no second source needed.
    - {id: senapred, type: telegram, channel: SenapredChile, lang: es, scope: CL, official: true, authority: SENAPRED}
    - {id: diarioelcentro, url: "https://www.diarioelcentro.cl/feed/", lang: es, scope: talca}
    - {id: diariotalca, url: "https://www.diariotalca.cl/feed/", lang: es, scope: talca}
    # World
    - {id: bbc_world, url: "https://feeds.bbci.co.uk/news/world/rss.xml", lang: en, scope: world}
    - {id: aljazeera, url: "https://www.aljazeera.com/xml/rss/all.xml", lang: en, scope: world}
    - {id: dw_world, url: "https://rss.dw.com/xml/rss-en-world", lang: en, scope: world}
  gdelt:                              # global news index, used to find extra outlets reporting the same thing
    enabled: true
    interval: 900
    timespan: 2h
    maxrecords: 75
    queries:
      - {scope: milan, q: "(Milano OR Milan) sourcecountry:italy", lang: it}
      - {scope: chile, q: "(Santiago OR Talca OR Maule OR Chile) sourcelang:spanish", lang: es}
      - {scope: biobio, q: "domain:biobiochile.cl", lang: es}

strikes:
  days_ahead: 2            # tell me about strikes starting within 2 days
  sectors: [trasporto pubblico locale, ferroviario, aereo, generale, plurisettoriale]
  level_major: high        # your city's transport or nationwide general/rail strikes (held for the digest at night)

air:
  info_pm25: 75            # daily mean PM2.5 µg/m³ → digest   (Chile: 80 = alerta)
  high_pm25: 110           # → alert                           (Chile: 110 = preemergencia)

backup:
  enabled: true
  time: "03:30"            # nightly, kept on the Pi in ~/iris/data/backups
  keep: 7
  telegram_weekday: sun    # weekly copy sent to your Telegram chat (off-device)

# Only alert for events that happened recently (avoids old items after a restart)
max_event_age_hours: 6
# Tell you if a source keeps failing for this long
source_failure_alert_minutes: 120
heartbeat_interval: 300
# Your network has no working IPv6 route, so connect over IPv4 only
force_ipv4: true
